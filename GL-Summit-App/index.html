    ? `<div class="logo-wrap">${LOGO}</div><button class="bell" data-go="announcements" aria-label="Updates">${svg('announcements','#EAE6E4')}${unread()?`<span class="dot">${unread()}</span>`:''}</button>`
    : `<button class="back" data-back>${svg('back','#EAE6E4')}Back</button><span class="title">${TITLES[r]||''}</span><span style="width:52px"></span>`;
  const lw = $('#appbar .logo-wrap svg'); if(lw){lw.setAttribute('class','logo');}
  $('#view').innerHTML = screens[r]();
  const active = tabRoute ? r : (r==='mine'?'schedule':(isHome?'home':'more'));
  $('#tabbar').innerHTML = TABS.map(([k,l])=>`<button class="${active===k?'on':''}" data-tab="${k}">${svg(k)}<span>${l}</span></button>`).join('');
  document.querySelectorAll('#index button').forEach(b=>b.classList.toggle('on', b.dataset.go===r));
  if(r==='announcements'){ setTimeout(()=>{ if(state.route==='announcements'){ANNS.forEach(a=>a.unread=false);} },2500) }
}

function openSheet(html){ $('#sheet').innerHTML = '<div class="grab"></div>'+html; $('#sheet').classList.add('on'); $('#sheetbg').classList.add('on') }
function closeSheet(){ $('#sheet').classList.remove('on'); $('#sheetbg').classList.remove('on') }

function speakerSheet(id){
  const s = sp(id);
  const sessions = Object.entries(SESSIONS).flatMap(([d,l])=>l.filter(x=>x.sp&&x.sp.includes(id)).map(x=>({...x,day:DAYS.find(y=>y.id===d)})));
  const bk = BREAKOUTS.filter(b=>b.lead===id);
  openSheet(`<div class="stack" style="gap:16px">
    <div class="row" style="gap:16px"><span class="avatar lg">${s.init}</span><div class="grow"><div style="font-family:var(--serif);font-size:24px;line-height:1.15">${s.name}</div><div class="meta">${s.role}<br>${s.org}</div></div></div>
    <p style="margin:0">${s.bio}</p>
    <div class="label">Where to find them</div>
    ${sessions.map(x=>`<div class="card"><div class="meta">${x.day.d} ${x.day.n} &middot; ${x.t} ${x.p}</div><b>${x.title}</b><div class="meta">${x.room}</div></div>`).join('')}
    ${bk.map(b=>`<div class="card"><div class="meta">${b.r}</div><b>${b.title}</b><div class="meta">${b.room}</div></div>`).join('')}
    <button class="btn" data-close>Done</button>
  </div>`);
}

document.addEventListener('click', e=>{
  const t = e.target.closest('button,[data-room]'); if(!t) return;
  const d = t.dataset;
  if(d.speaker){ speakerSheet(d.speaker); return }
  if(d.close!==undefined){ closeSheet(); return }
  if(d.go){ closeSheet(); go(d.go); return }
  if(d.tab){ go(d.tab); return }
  if(d.back!==undefined){ back(); return }
  if(d.day){ state.day=d.day; render(); return }
  if(d.star){ state.starred.has(d.star)?state.starred.delete(d.star):(state.starred.add(d.star),toast('Added to My schedule')); render(); return }
  if(d.room){ state.room=d.room; const y=$('#view').scrollTop; render(); $('#view').scrollTop=y; return }
  if(d.reserve){ if(state.reserved.has(d.reserve)){state.reserved.delete(d.reserve);toast('Seat released')} else {const b=BREAKOUTS.find(x=>x.id===d.reserve); BREAKOUTS.filter(x=>x.r===b.r).forEach(x=>state.reserved.delete(x.id)); state.reserved.add(d.reserve); toast('Seat reserved')} const y=$('#view').scrollTop; render(); $('#view').scrollTop=y; return }
  if(d.wait){ toast('You are on the waitlist'); return }
  if(d.city){ state.city=d.city; render(); return }
  if(d.connect){ state.connected.has(d.connect)?state.connected.delete(d.connect):(state.connected.add(d.connect),toast('Contact saved')); const y=$('#view').scrollTop; render(); $('#view').scrollTop=y; return }
  if(d.vote){ const q=QUESTIONS.find(x=>x.id===d.vote); if(state.voted.has(q.id)){state.voted.delete(q.id);q.votes--} else {state.voted.add(q.id);q.votes++} const y=$('#view').scrollTop; render(); $('#view').scrollTop=y; return }
  if(d.readall!==undefined){ ANNS.forEach(a=>a.unread=false); render(); return }
  if(d.copy){ const v=d.copy; (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Copied')).catch(()=>toast(v)); return }
  if(d.res){ toast('Opens: '+d.res); return }
  if(d.interest){ toast('We will send you details'); return }
});
$('#sheetbg').addEventListener('click', closeSheet);
document.addEventListener('submit', e=>{
  if(e.target.id!=='askform') return;
  e.preventDefault();
  const v = $('#askq').value.trim(); if(!v){ toast('Type a question first'); return }
  const id='q'+Date.now(); QUESTIONS.push({id,text:v,votes:1,anon:$('#anon').checked,who:'You'}); state.voted.add(id);
  render(); toast('Question sent');
});
document.addEventListener('input', e=>{
  if(e.target.id!=='q') return;
  state.q = e.target.value; const pos=e.target.selectionStart;
  render(); const i=$('#q'); i.focus(); i.setSelectionRange(pos,pos);
});

$('#index').innerHTML = SECTIONS.map(([k,l],i)=>`<li><button data-go="${k}">${l}</button></li>`).join('');
render();
</script>
</body>
</html>
